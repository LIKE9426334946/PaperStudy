experiment:
  name: lenet5_paper_reproduction
  seed: 1998
  output_dir: results/paper
  checkpoint_dir: checkpoints/paper

device: auto

data:
  root: data
  download: true
  num_workers: 4
  pin_memory: true
  batch_size: 1
  samples_per_epoch: 60000
  augmentation:
    enabled: true
    variants_per_image: 10
    translate_pixels: 2.0
    scale_fraction: 0.15
    squeeze_fraction: 0.15
    shear_degrees: 15.0

model:
  activation_amplitude: 1.7159
  activation_slope: 0.6666666667
  trainable_rbf: false

loss:
  name: rbf_mse
  rubbish_class_j: 10.0

training:
  epochs: 20
  optimizer: sdlm
  mu: 0.02
  curvature_samples: 500
  curvature_batch_size: 1
  curvature_method: exact
  curvature_probes: 1
  gradient_clip_norm: null
  log_interval: 1000
  learning_rate_schedule:
    - [0, 0.0005]
    - [2, 0.0002]
    - [5, 0.0001]
    - [8, 0.00005]
    - [12, 0.00001]
