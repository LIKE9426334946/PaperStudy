<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1310" viewBox="0 0 1180 1310" role="img" aria-labelledby="title desc">
<title id="title">Transformer encoder-decoder architecture</title>
<desc id="desc">A top-down reading diagram of Attention Is All You Need. Both sides share the embedding matrix. Each encoder layer contains self-attention and a feed-forward network. Each decoder layer contains causal self-attention, cross-attention over final encoder memory, and a feed-forward network. Every sublayer uses residual dropout followed by addition and layer normalization.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#40516b"/></marker><marker id="memory-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#23796a"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182b49} .title{font-size:28px;font-weight:700} .sub{font-size:16px;fill:#52617a} .label{font-size:18px;font-weight:600} .detail{font-size:15px;fill:#52617a} .group{font-size:15px;font-weight:700;letter-spacing:1px} .edge{fill:none;stroke:#40516b;stroke-width:2;stroke-linejoin:round;marker-end:url(#arrow)} .skip{fill:none;stroke:#93a0b2;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<rect width="1180" height="1310" fill="#fff"/>

