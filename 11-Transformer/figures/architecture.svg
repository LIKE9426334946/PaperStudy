<text x="310" y="256" class="label" text-anchor="middle" >Shared embedding E × √D</text>
<text x="310" y="282" class="detail" text-anchor="middle" >+ sinusoidal position encoding</text>
<text x="310" y="307" class="detail" text-anchor="middle" >Dropout → [B, length, D]</text>
<rect x="755" y="230" width="300" height="96" rx="12" fill="#f4edfd" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905" y="256" class="label" text-anchor="middle" >Shared embedding E × √D</text>
<text x="905" y="282" class="detail" text-anchor="middle" >+ sinusoidal position encoding</text>
<text x="905" y="307" class="detail" text-anchor="middle" >Dropout → [B, length, D]</text>
<path d="M310 185 V230" class="edge"/>
<path d="M905 185 V230" class="edge"/>
<path d="M460 270 H755" fill="none" stroke="#9978bf" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="605" y="253" class="detail" text-anchor="middle" >same E</text>
<rect x="80" y="359" width="470" height="446" rx="18" fill="#f7faff" stroke="#cedbee" stroke-width="1.5"/>
<rect x="675" y="359" width="465" height="621" rx="18" fill="#f8fafb" stroke="#d1dce1" stroke-width="1.5"/>
<text x="105" y="383" class="group" text-anchor="start" >ENCODER LAYER × N</text>
<text x="700" y="383" class="group" text-anchor="start" >DECODER LAYER × N</text>
<rect x="160" y="413" width="300" height="60" rx="12" fill="#edf4fd" stroke="#c5cfde" stroke-width="1.5"/>
<text x="310.0" y="440.0" class="label" text-anchor="middle" >Multi-head self-attention</text>
<text x="310.0" y="463.0" class="detail" text-anchor="middle" >Q, K, V from source state</text>
