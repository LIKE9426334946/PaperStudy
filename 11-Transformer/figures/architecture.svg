<text x="905.0" y="840.0" class="label" text-anchor="middle" >Position-wise FFN</text>
<text x="905.0" y="863.0" class="detail" text-anchor="middle" >D → d_ff → D · ReLU</text>
<rect x="755" y="913" width="300" height="44" rx="12" fill="#fff4d6" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905.0" y="941.0" class="label" text-anchor="middle" >Add &amp; Norm</text>
