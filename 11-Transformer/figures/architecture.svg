<rect x="755" y="125" width="300" height="60" rx="12" fill="#f4f6fa" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905.0" y="152.0" class="label" text-anchor="middle" >Shifted target token IDs</text>
<text x="905.0" y="175.0" class="detail" text-anchor="middle" >[B, T] · starts with BOS</text>
