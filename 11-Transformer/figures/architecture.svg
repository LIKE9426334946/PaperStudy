<text x="615" y="865" class="detail" text-anchor="start" >to every</text>
<text x="615" y="888" class="detail" text-anchor="start" >decoder layer</text>
<text x="623" y="627" class="label" text-anchor="start" >K, V</text>
<path d="M905 957 V1040" class="edge"/>
<rect x="755" y="1040" width="300" height="60" rx="12" fill="#f4edfd" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905.0" y="1067.0" class="label" text-anchor="middle" >Shared output projection</text>
<text x="905.0" y="1090.0" class="detail" text-anchor="middle" >H @ Eᵀ → logits [B, T, V]</text>
<path d="M905 1100 V1140" class="edge"/>
<rect x="755" y="1140" width="300" height="60" rx="12" fill="#e5f5ef" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905.0" y="1167.0" class="label" text-anchor="middle" >Softmax over vocabulary</text>
<text x="905.0" y="1190.0" class="detail" text-anchor="middle" >probabilities [B, T, V]</text>
<text x="905" y="1228" class="detail" text-anchor="middle" >Applied outside forward() when needed</text>
<rect x="80" y="987" width="555" height="235" rx="14" fill="#f8fafc" stroke="#dce2eb" stroke-width="1.5"/>
<text x="105" y="1022" class="group" text-anchor="start" >READING THE DIAGRAM</text>
<text x="105" y="1055" class="detail" text-anchor="start" >Add &amp; Norm = LayerNorm(x + Dropout(sublayer(x)))</text>
<text x="105" y="1086" class="detail" text-anchor="start" >Thin side paths carry the residual x.</text>
<text x="105" y="1117" class="detail" text-anchor="start" >Self-attention on the decoder blocks future keys.</text>
<text x="105" y="1148" class="detail" text-anchor="start" >All attention operations also mask the relevant PAD keys.</text>
<text x="105" y="1179" class="detail" text-anchor="start" >Repeated layers have distinct parameters.</text>
<text x="105" y="1205" class="detail" text-anchor="start" >Only embeddings and the vocabulary projection share E.</text>
<text x="50" y="1280" class="sub" text-anchor="start" >Study diagram based on Vaswani et al., NIPS 2017, Figure 1. Flow is drawn from top to bottom.</text>
</svg>