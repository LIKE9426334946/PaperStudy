<text x="310.0" y="882.0" class="label" text-anchor="middle" >Final encoder memory</text>
<text x="310.0" y="905.0" class="detail" text-anchor="middle" >[B, S, D]</text>
<rect x="755" y="413" width="300" height="60" rx="12" fill="#edf4fd" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905.0" y="440.0" class="label" text-anchor="middle" >Masked self-attention</text>
<text x="905.0" y="463.0" class="detail" text-anchor="middle" >Q, K, V from target state</text>
<rect x="755" y="513" width="300" height="44" rx="12" fill="#fff4d6" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905.0" y="541.0" class="label" text-anchor="middle" >Add &amp; Norm</text>
<rect x="755" y="613" width="300" height="60" rx="12" fill="#e5f5ef" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905.0" y="640.0" class="label" text-anchor="middle" >Cross-attention</text>
<text x="905.0" y="663.0" class="detail" text-anchor="middle" >Q: decoder · K, V: memory</text>
<rect x="755" y="713" width="300" height="44" rx="12" fill="#fff4d6" stroke="#c5cfde" stroke-width="1.5"/>
<text x="905.0" y="741.0" class="label" text-anchor="middle" >Add &amp; Norm</text>
