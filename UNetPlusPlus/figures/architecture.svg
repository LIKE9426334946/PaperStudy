<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
<title id="title">UNet++ nested dense skip pathways</title>
<desc id="desc">15 feature nodes in five resolution levels. Gray edges pool, green edges upsample, blue edges concatenate all earlier same-level nodes, red edges lead to four prediction heads.</desc>
<defs>
  <marker id="pool" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#697586" /></marker>
  <marker id="up" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#188568" /></marker>
  <marker id="skip" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#527ed4" /></marker>
  <marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c44c60" /></marker>
</defs>
